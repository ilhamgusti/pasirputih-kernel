name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: ubuntu-24.04-arm
          - arch: x86_64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential bc bison flex libelf-dev libssl-dev
      - name: Cache kernel source
        uses: actions/cache@v4
        with:
          path: build/linux-*.tar.xz
          key: linux-${{ hashFiles('build.sh') }}
      - name: Build
        run: ./build.sh ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: false
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir release
          for d in dist/kernel-*; do
            cp "$d"/vmlinux-* "$d"/config-* release/
          done
          (cd release && sha256sum * > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes "Guest kernel for Firecracker, see README. Verify with: sha256sum -c SHA256SUMS"
